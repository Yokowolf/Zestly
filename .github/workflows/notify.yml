# Envía la notificación push, personalizada según los datos reales de
# cada usuario (comidas, agua, entrenamiento) — 3 franjas al día en vez
# de una sola genérica. Gratis (Actions no cobra por cron), no necesita
# Firebase Blaze ni ningún backend corriendo 24/7 — cada corrida dura
# unos segundos.
name: Send daily notification

on:
  schedule:
    - cron: '0 14 * * *' # 9:00am Colombia — frase/dato + desayuno (6-9am) + entreno de hoy (siempre se envía)
    - cron: '0 20 * * *' # 3:00pm Colombia — almuerzo (12-3pm) + agua si va atrasada (solo si falta algo)
    - cron: '0 2 * * *'  # 9:00pm Colombia (02:00 UTC del día siguiente) — cena (7-9pm) + entreno si aún no (solo si falta algo)
  workflow_dispatch: # permite elegir una franja y dispararla manual, para probar sin esperar al cron
    inputs:
      slot:
        description: 'Franja a enviar'
        required: true
        type: choice
        options: [morning, afternoon, evening]
        default: morning

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: notifications
      - name: Resolver franja según el cron que disparó (o el input manual)
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "0 14 * * *") echo "slot=morning" >> "$GITHUB_OUTPUT" ;;
            "0 20 * * *") echo "slot=afternoon" >> "$GITHUB_OUTPUT" ;;
            "0 2 * * *") echo "slot=evening" >> "$GITHUB_OUTPUT" ;;
            *) echo "slot=${{ github.event.inputs.slot || 'morning' }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: node send.js
        working-directory: notifications
        env:
          SLOT: ${{ steps.slot.outputs.slot }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
